name: Build JTmenu.bundle

on:
  push:
    branches:
      - JTmenu

jobs:
  build-bundle:
    name: Copy files into JTmenu.bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create bundle Contents directory
        run: mkdir -p "AutoCAD plugin/JTmenu.bundle/Contents"

      - name: Copy folders into Contents
        run: |
          cp -r functions  "AutoCAD plugin/JTmenu.bundle/Contents/"
          cp -r icons      "AutoCAD plugin/JTmenu.bundle/Contents/"
          cp -r resource   "AutoCAD plugin/JTmenu.bundle/Contents/"

      - name: Copy root files into Contents
        run: |
          cp JTMenu.cuix  "AutoCAD plugin/JTmenu.bundle/Contents/"
          cp JTmenu.mnl   "AutoCAD plugin/JTmenu.bundle/Contents/"

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: JTmenu.bundle
          path: "AutoCAD plugin/JTmenu.bundle/"
          retention-days: 30
