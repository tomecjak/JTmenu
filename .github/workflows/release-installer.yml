name: Release JTmenu installer

# Len rucne spustenie (Actions > "Release JTmenu installer" >
# Run workflow). Zostavi JTmenu-Setup.exe a nahra ho do GitHub Release
# s tagom "latest" (existujuci release/tag sa najprv zmaze a vytvori sa
# nanovo, nech vzdy uklazuje na commit, z ktoreho bol zostaveny) - teda
# stale ten isty verejny odkaz na stiahnutie:
# https://github.com/<repo>/releases/tag/latest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repozitara
        uses: actions/checkout@v4

      - name: Instalacia Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Zostavenie GUI instalatora (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=3.0.${{ github.run_number }} installer\JTmenu.iss

      - name: Publikovanie/aktualizacia GitHub Release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest "dist/JTmenu-Setup.exe" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "JTmenu - najnovsi build" `
            --notes "Automaticky vygenerovane z commitu ${{ github.sha }}. Stiahnite JTmenu-Setup.exe a spustite ho - nepotrebuje administratorske prava, instaluje len pre aktualneho pouzivatela."
